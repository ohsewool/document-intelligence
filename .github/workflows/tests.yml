# Tests do not prove anything if they quietly stop running.
#
# Every job below asserts how many tests were collected. A dependency that
# vanishes turns importorskip into a silent pass: this repository would go from
# 177 tests to 151 and still show green. The count is the difference between
# "the tests passed" and "the tests ran".

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # requirements.txt가 아니라 손으로 적은 목록이었다. 그래서 파일에 무엇이
        # 적혀 있든 CI는 상관하지 않았고, README가 안내하는 설치 경로는 어디서도
        # 돌아본 적이 없었다 - pypdf를 추가했더니 CI만 11개를 덜 수집했다.
        run: pip install -r requirements.txt

      - name: The skip guard must be able to fail
        # 여기 있던 것은 `Refuse a silently shrinking suite`였고, **이름이 말하는
        # 일을 못 했다.** 보는 것이 `--collect-only`의 수집 수인데 런타임 skip은
        # 수집 수를 바꾸지 않는다. 2026-08-24에 재봤다.
        #
        #     샘플 PDF를 못 받는 상태
        #       수집 수  234   ← 관문이 보는 수. 하한 67과 비교해 통과시킨다
        #       실행     201 passed, **32 skipped**
        #
        # 하한선이 67인 것도 따로 문제였다. 실제 수집이 234이니 167개가 사라져도
        # 초록불이다. 그리고 수집 수의 **정확한** 비교는 바로 아래 README 단계가
        # 이미 하고 있었다 — 이 단계는 못 보는 것을 보는 척하면서 아무것도
        # 더하지 않고 있었다.
        #
        # 이제 skip은 `tests/conftest.py`의 집합 훅이 런타임에 지킨다. 여기서는
        # **그 훅이 살아 있는지**를 본다: 샘플 PDF를 못 받는 상태를 일부러 만들어
        # 빨간불이 나오는지 확인한다. 종료 코드만 보지 않는다 — 스위트는 다른
        # 이유로도 실패하고, **엉뚱한 이유로 도는 대조는 대조가 아니다.**
        #
        # 이 단계는 스위트보다 먼저 온다. 뒤에 오면 앞 단계가 이미 PDF를 받아둬서
        # "못 받는 상태"를 만들 수 없다.
        env:
          SAMPLE_PDF_URL: http://127.0.0.1:9/nope
        run: |
          if python -m pytest -q > /tmp/skip-control.log 2>&1; then
            echo "::error::샘플 PDF 없이도 스위트가 초록불이다 — skip 집합 훅이 죽었다."
            tail -20 /tmp/skip-control.log
            exit 1
          fi
          if ! grep -q "SKIP 집합 검사 실패" /tmp/skip-control.log; then
            echo "::error::빨간불이지만 skip 집합 때문이 아니다. 대조가 무효다."
            tail -20 /tmp/skip-control.log
            exit 1
          fi
          echo "control passed: 샘플 PDF가 없으면 훅이 말한다"

      - name: Refuse a README that miscounts its own tests
        run: |
          # These numbers were hand-maintained and drifted twice - the second
          # time in a repository whose README I had just verified. A count kept
          # by hand is a count that rots, so CI compares them.
          claimed=$(grep -oE '[0-9]+ tests' README.md | head -1 | grep -oE '^[0-9]+')
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "README says ${claimed:-none}, pytest collects ${collected:-none}"
          if [ "${claimed:-0}" != "${collected:-1}" ]; then
            echo "::error::README claims ${claimed} tests; ${collected} are collected."
            exit 1
          fi

      - name: Run the suite
        run: python -m pytest -q -rs   # -rs names every skip and why

      - name: Refuse a line this suite never executes
        # A coverage sweep on 2026-08-22 found 7 statements no test ever ran -
        # the fewest of the five repositories, and still enough to include the
        # branch that decides what happens when the model refuses a whole page.
        #
        # 100% is a gate, not a target. A new defensive branch either gets a test
        # or gets `# pragma: no cover` with a reason beside it.
        #
        # `--branch`, added a day later: a statement gate says every line ran,
        # not that every `if` went both ways. Re-measured here and it was already
        # 100% - the only one of the four that was. An audit that finds nothing
        # is a result, and it is not the same as an audit nobody ran.
        run: |
          # `adapters` was outside this gate until 2026-08-23. It holds the
          # top-level re-export the README documents, and it read 0% - not
          # because nothing tested it, but because every test of it runs in a
          # **subprocess** (they plant a decoy on `sys.path`, which needs its
          # own interpreter). In-process coverage cannot see those runs.
          #
          # "not tested" and "not visible to the meter" look identical on the
          # report. One in-process test now asserts the re-export hands over the
          # same objects here, which is a different question from the collision
          # ones and closes the gap honestly rather than by widening a threshold.
          pip install -q coverage
          python -m coverage run --branch --source=document_intelligence,adapters -m pytest -q > /dev/null
          python -m coverage report -m --fail-under=100
